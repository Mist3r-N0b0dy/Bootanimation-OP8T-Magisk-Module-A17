# Identity of one deliverable. build.sh rewrites module/module.prop from these
# values and names the zip OUTPUT_NAME, so this file is the only place a variant
# is described. Quote values that contain spaces; keep them free of parentheses.
#
# Validated on: OnePlus 8T (kebab), crDroid 13.x / Android 17, Magisk 31.1.

MODULE_ID=bootanim-mist3r
MODULE_NAME="BootAnimation NetHunter OP8T"
MODULE_VERSION=1.0.0
MODULE_VERSION_CODE=100
MODULE_AUTHOR="Mist3r_N0b0dy"
MODULE_DESCRIPTION="1080x2400 @24fps animation with sound, A17 / crDroid 13.x. Root helper for audio; bind-mounts over /product/media/bootanimation.zip."

OUTPUT_NAME="NetHunter-BootAnimation-OP8T-crDroid13-A17-MagiskModule.zip"

# Panel of the OnePlus 8T: card0-DSI-1/modes reads 1080x2400x60. Frames are
# never rescaled at boot, so desc.txt has to carry exactly this resolution.
PANEL_W=1080
PANEL_H=2400
FPS=24

# JPEG quality passed to ffmpeg. 4 is what the released animation was built
# with: verified byte-for-byte identical frame by frame against the module
# installed on the device, and it keeps the zip at ~34 MB for 10 s. At q=2 the
# same video gives 50 MB -- the player reads this file at boot, so weight is a
# feature.
QUALITY=4
